# Non-secret defaults. Env vars and .env override these. Secrets live in .env only.

environment: local
log_level: INFO

llm_model: google/gemma-4-31b-it
llm_base_url: https://openrouter.ai/api/v1
llm_temperature: 0.0
# Sampling params (vLLM). Leave unset to omit from the request payload.
# llm_top_p: 0.95
# llm_top_k: 64
# llm_repetition_penalty: 1.0
llm_enable_thinking: false
# Escape hatch for any other vLLM sampling knob; merged into the request body.
# llm_extra_body:
#   min_p: 0.0
#   presence_penalty: 0.0
llm_max_output_tokens: 16000
llm_max_retries: 10
llm_retry_delay_s: 1.0
llm_timeout: 120.0

vlm_dpi: 144
vlm_pages_per_batch: 1
vlm_max_images_per_call: 1
vlm_window_overlap: 0
vlm_verify_heading_text: false
# Dynamic vision: per-request soft-token budget for the vision tower.
# vlm_max_soft_tokens: 1120

index_add_node_id: true
index_add_node_summary: true
index_add_node_text: false
index_add_doc_description: true
index_results_dir: ./examples/results

# Multi-document filesystem (Phase 4). filesystem_meta_model defaults to llm_model.
filesystem_axes_default: ["category", "entities"]
filesystem_max_tree_depth: 3
filesystem_flatten_threshold: 0.6
filesystem_max_llm_hops_per_query: 5

tracing_enabled: false
langfuse_host: http://localhost:3000
