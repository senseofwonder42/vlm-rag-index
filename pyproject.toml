[project]
name = "vlm-rag-index"
version = "0.0.0"
description = "Vectorless multi-document RAG: VLM-extracted document trees navigated by a LangGraph ReAct agent."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "pypdf2>=3.0",
    "jinja2>=3.1",
    "langgraph>1",
    "langchain-openai>=0.1",
    "langfuse>=2.40",
    "rich>=15.0.0",
    "langchain>=1.3.4",
]

[project.scripts]
index = "vlm_rag_index.cli.index:main"
subsample = "vlm_rag_index.eval.subsample:main"
inject = "vlm_rag_index.eval.inject:main"
ask = "vlm_rag_index.eval.ask:main"
eval-pages = "vlm_rag_index.eval.run_eval:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-env>=1.1",
    "langgraph-cli[inmem]>=0.4.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vlm_rag_index"]

[tool.ruff]
line-length = 105
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "PTH", "ANN", "ARG"]
# ANN401 forbids `Any`; CODING_STANDARDS.md allows it as a last resort.
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "ARG"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fitz", "fitz.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
env = [
    "ENVIRONMENT=test",
    "LOG_LEVEL=INFO",
]
